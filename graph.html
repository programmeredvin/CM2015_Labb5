<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Today's heart rate</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="jqFhir.js"></script>
</head>
<body>

    <div id="plot_area" style="width:1000px;height:350px;"></div>

    <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
    <script type="module">

      const PATIENT_ID = "17";

      const client = jqFhir({
          baseUrl: "https://hapim.app.cloud.cbh.kth.se/fhir"
      });

      // Initialize plotly
      const plotly_elem = document.getElementById('plot_area');
      

      // Old dummy plot:
      /*
      const plotly_layout = {
        margin: {t: 50},
        title: 'Heart Rate',
        grid: { rows: 1, columns: 2, pattern: "independent" }
      };
      var plotly_data = [
        {x: [0,1,2,3,4], y: [0,1,4,9,16], type: 'scatter', name: 'heartrate'}
      ];

      Plotly.newPlot(plotly_elem, plotly_data, plotly_layout);
      */
      
  function getMyHRData() {

    console.log("Updating graph:", new Date());

    client.search({
        type: "Observation",
        query: {
            subject: "Patient/" + PATIENT_ID,
            code: "http://loinc.org|8867-4",
            _sort: "-date",
        }
    })

    .done(function(bundle) {

        const observations = (bundle.entry || [])
            .map(e => e.resource)
            .filter(o =>
                o.effectiveDateTime &&
                o.valueQuantity &&
                new Date(o.effectiveDateTime).toDateString() === new Date().toDateString()
            )
            .sort((a, b) =>
                new Date(a.effectiveDateTime) - new Date(b.effectiveDateTime)
            );


        const times = observations.map(o =>
            new Date(o.effectiveDateTime)
        );

        const values = observations.map(o =>
            o.valueQuantity.value
        );


        const latest =
            values.length ? values[values.length - 1] : 0;

        const previous =
            values.length > 1 ? values[values.length - 2] : latest;


        Plotly.react(plotly_elem, [

            {
                x: times,
                y: values,
                type: "scatter",
                mode: "lines+markers",
                name: "Heart rate"
            },

            {
                type: "indicator",
                mode: "number+delta",
                value: latest,
                delta: {
                    reference: previous
                },
                title: {
                    text: "Latest HR"
                },
                domain: {
                    x: [0.75, 1],
                    y: [0, 1]
                }
            }

        ], {

            title: "Today's Heart Rate",

            xaxis: {
                domain: [0, 0.65]
            },

            yaxis: {
                title: "BPM"
            }
        });
    });
  }

getMyHRData();
setInterval(getMyHRData, 10000); //Gets the HR data every 10s
</script>
</body>
</html>
