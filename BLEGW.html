<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HR WebBLE Gateway</title>
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="jqFhir.js"></script>
</head>
</head>
<body>

<input id="HRValue" style="background-color: yellow; padding: 10pt; width: 30pt;" value="60"> BPM

<p>
<button id="startBtn">Start sensor</button>
<button id="stopBtn">Stop sensor</button>
<button id="sendBtn" onclick="sendHRValue()">Send HR Value</button>
</p>

<script>
  // Our observation constants
  const PATIENT_ID = "17"
  const FHIR_BASE_URL = "https://hapim.app.cloud.cbh.kth.se/fhir";
  // FHIR client
  const client = jqFhir({baseUrl: FHIR_BASE_URL});

  // Other constants
  const val = document.getElementById('HRValue');
  
  let latestHR = null;
  let latestHRTime = null;
  
  let targetDevice;
  let serviceUART;
  let charUARTRX;

  const BLE_UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const BLE_UART_RX_CHAR = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


  console.log("init");

  // This function is called when the Micro:Bit sends a value to the GW App.
  // The Micro:Bit should send the latest step counter value every 10 seconds.

  function handleBLENotifications(event)
    {
      let result = "";
      for (var i = 0; i < event.target.value.byteLength; i++) {
          result += String.fromCharCode(event.target.value.getUint8(i));
      }
      

      console.log(result);
      if (result.includes("BPM")) {
            const bpm = Number(
                result.replace("BPM", "").trim()
            );

            if (Number.isFinite(bpm)) {

                latestHR = bpm;
                latestHRTime = new Date().toISOString();

                val.value = bpm;
            }
        
        }
      
    }

  function sendHRValue()
  {
    console.log("Send HR Value");

    //Do not send if we haven't read anything
    if (latestHR === null) {
    console.log("No HR value received yet");
    return;
    }

    // Time when this observation is sent
    const observationTime = new Date().toISOString();

    // Create FHIR Observation Resource
    const observation = {
      resourceType: "Observation",
      status: "final",

      // Heart rate is a vital sign
      category: [
        {
          coding: [
            {
              system: "http://terminology.hl7.org/CodeSystem/observation-category",
              code: "vital-signs",
              display: "Vital Signs"
            }
          ]
        }
      ],

      // LOINC code for heart rate
      code: {
        coding: [
          {
            system: "http://loinc.org",
            code: "8867-4",
            display: "Heart rate"
          }
        ],
        text: "Heart rate"
      },

      // Patient that this measurement belongs to
      subject: {
        reference:
          "Patient/" + PATIENT_ID
      },

      // Time when the observation is sent
        effectiveDateTime: observationTime,

      // Actual heart rate measurement
      valueQuantity: {
        value: latestHR,
        unit: "beats/minute",
        system: "http://unitsofmeasure.org",
        code: "/min"
      },

      // Measurement method: PPG
      method: {
        coding: [
          {
            system: "http://snomed.info/sct",
            code: "20811003",
            display: "Quantitative photoplethysmography, vascular"
          }
        ],
        text: "Photoplethysmography"
      }
    };

    console.log("Observation to send:", observation);

    // Send Observation to HAPI FHIR
    client.create({
      entry: {
        content: observation
      }
    })

    .done(function(response) {
      console.log(
        "FHIR Observation created successfully:",
        response
      );
    })

    .fail(function(error) {
      console.error(
        "Failed to create FHIR Observation:",
        error
      );
    });
  }

  


  function startBluetooth()
  {
      console.log('Requesting Bluetooth Device...');
      navigator.bluetooth.requestDevice({filters: [
                                        {services: [BLE_UART_SERVICE]},
                                        {namePrefix: 'BBC micro:bit '}]})
      .then(device => {
            console.log('Connecting to GATT Server...');
            targetDevice = device;
            return device.gatt.connect();
      })
      .then(server => {
            console.log('Getting Service...');
            return server.getPrimaryService(BLE_UART_SERVICE);
      })
      .then(service => {
            console.log('Got service');
            serviceUART = service;
            return service.getCharacteristic(BLE_UART_RX_CHAR);
      })
      .then(characteristic => {
            console.log('Got char');
            charUARTRX = characteristic;
            return charUARTRX.startNotifications();
      })
      .then(_ => {
            console.log('Notifications started');
            charUARTRX.addEventListener('characteristicvaluechanged',
                                              handleBLENotifications);
      })
      .catch(error =>{
           console.error(error);
      });
  }


  document.getElementById('startBtn').addEventListener('click', () => {
      startBluetooth();
  });

  document.getElementById('stopBtn').addEventListener('click', () => {
    if (serviceUART == null) {
      return;
    }

    charUARTRX.stopNotifications()
    .then(_ => {
        console.log('Notifications stopped');
        charUARTRX.removeEventListener('characteristicvaluechanged',
                                       handleBLENotifications);
        serviceUART = null;
        targetDevice.gatt.disconnect();
    })
    .catch(error => {
        console.log('Argh! ' + error);
    });
});


setInterval(sendHRValue, 60 * 1000);

</script>
</body>
</html>
